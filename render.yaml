# Render deployment (build prompt Section 10).
#
# One web service. The database is deliberately NOT declared here: the
# recommended production setup is an external Neon/Supabase free-tier Postgres,
# which is permanent and $0, whereas Render's free Postgres expires after 30
# days. Point DATABASE_URL at it and the total fixed cost is the $7 starter
# plan below.
services:
  - type: web
    name: soulone-app
    runtime: node
    plan: starter
    region: singapore # closest to an India-based customer base
    # Migrations run in preDeployCommand, after a successful build and before
    # the new version takes traffic: a failed build can't leave the database
    # migrated ahead of the code, and a failed migration keeps the old version live.
    buildCommand: npm ci && npx prisma generate && npm run build
    preDeployCommand: npx prisma migrate deploy
    startCommand: npm run start
    healthCheckPath: /api/health
    # Deploy only commits whose GitHub checks (CI) have passed.
    autoDeployTrigger: checksPass
    envVars:
      - key: DATABASE_URL
        sync: false
      # Direct (unpooled) connection, used only by migrations in preDeployCommand.
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SITE_URL
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: NEXT_PUBLIC_FSSAI_LICENCE_NUMBER
        sync: false
      - key: NEXT_PUBLIC_GSTIN
        sync: false
      - key: NODE_ENV
        value: production
      - key: CRON_SECRET
        generateValue: true

  # Fires the near-expiry owner alert once a day (Section 7.6). The email
  # logic has existed since phase 7; this is what actually calls it on a
  # schedule instead of leaving it dormant. Needs the same CRON_SECRET as the
  # web service above so Render's generated value matches what the route
  # checks — copy it over manually in the dashboard after first deploy if the
  # two services don't share generated env vars automatically.
  - type: cron
    name: soulone-near-expiry-alert
    runtime: node
    plan: starter
    region: singapore
    schedule: "0 3 * * *" # 08:30 IST daily
    buildCommand: "true" # nothing to build — the request just hits the already-deployed web service
    startCommand: >-
      node -e "fetch(process.env.TARGET_URL,{headers:{authorization:'Bearer '+process.env.CRON_SECRET}}).then(async r=>{console.log(r.status,await r.text());if(!r.ok)process.exit(1)}).catch(e=>{console.error(e);process.exit(1)})"
    envVars:
      - key: TARGET_URL
        value: https://soulone-app.onrender.com/api/cron/near-expiry-alert
      - key: CRON_SECRET
        sync: false

  # Closes online orders left unpaid for 30 minutes and returns their stock
  # (src/app/api/cron/expire-unpaid). Without it, every closed payment window
  # holds stock forever. Same CRON_SECRET as the web service.
  - type: cron
    name: soulone-expire-unpaid
    runtime: node
    plan: starter
    region: singapore
    schedule: "*/10 * * * *"
    buildCommand: "true"
    startCommand: >-
      node -e "fetch(process.env.TARGET_URL,{headers:{authorization:'Bearer '+process.env.CRON_SECRET}}).then(async r=>{console.log(r.status,await r.text());if(!r.ok)process.exit(1)}).catch(e=>{console.error(e);process.exit(1)})"
    envVars:
      - key: TARGET_URL
        value: https://soulone-app.onrender.com/api/cron/expire-unpaid
      - key: CRON_SECRET
        sync: false
